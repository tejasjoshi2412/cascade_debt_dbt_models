version: 2

models:
  - name: int_sightings
    description: |
      Combined view of agent field reports across all 8 Interpol agency regions,
      each mapped to a common data dictionary. Primary key is sighting_id.
    columns:
      - name: sighting_id
        description: Primary key. Deterministic surrogate key identifying a unique sighting.
        data_tests:
          - not_null
          - unique

  - name: int_agent
    description: |
      Distinct agents extracted from the combined sightings, each tied to a regional
      HQ city. Primary key is agent_id.
    columns:
      - name: agent_id
        description: Primary key. Deterministic surrogate key identifying a unique agent-HQ-region.
        data_tests:
          - not_null
          - unique

  - name: int_sighting_behavior
    description: |
      Distinct behavior descriptors extracted from the combined sightings.
      Primary key is behavior_id.
    columns:
      - name: behavior_id
        description: Primary key. Deterministic surrogate key identifying a unique behavior.
        data_tests:
          - not_null
          - unique

  - name: int_sighting_locations
    description: |
      Distinct sighting locations (city, country, region) extracted from the combined
      sightings. Primary key is location_id.
    columns:
      - name: location_id
        description: Primary key. Deterministic surrogate key identifying a unique location.
        data_tests:
          - not_null
          - unique

  - name: int_sighting_witness
    description: |
      Distinct witnesses extracted from the combined sightings. Primary key is witness_id.
    columns:
      - name: witness_id
        description: Primary key. Deterministic surrogate key identifying a unique witness.
        data_tests:
          - not_null
          - unique