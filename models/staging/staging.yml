version: 2

models:
  - name: stg_africa_sightings
    description: |
      Field reports from the Africa regional agency, mapped to a common data
      dictionary. Primary key is sighting_id.
    columns:
      - name: sighting_id
        description: Primary key. Deterministic surrogate key identifying a unique sighting.
        data_tests:
          - not_null
          - unique

