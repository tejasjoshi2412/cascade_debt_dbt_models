version: 2

sources:
  - name: interpol
    description: >
      Raw agent field reports extracted from the Carmen Sandiego workbook
      (carmen_sightings_20220629061307.xlsx). Each table corresponds to one
      Interpol agency region. Column names differ per region (local language/dialect).
    database: cascade_debt
    schema: public_raw
    loader: seed

    tables:
      - name: AFRICA
        description: Field reports from the Africa regional agency. Standard column naming.
      - name: AMERICA
        description: Field reports from the America regional agency. Standard column naming.
      - name: ASIA
        description: Field reports from the Asia regional agency. Column names in Chinese.
      - name: ATLANTIC
        description: Field reports from the Atlantic regional agency. Standard column naming.
      - name: AUSTRALIA
        description: Field reports from the Australia regional agency. Australian English dialect.
      - name: EUROPE
        description: Field reports from the Europe regional agency. Column names in French.
      - name: INDIAN
        description: Field reports from the Indian regional agency. Standard column naming.
      - name: PACIFIC
        description: Field reports from the Pacific regional agency. Custom column naming.
